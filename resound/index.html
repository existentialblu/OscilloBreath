<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Resound</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Precision-timed resonant breathing with calm audio guidance.">
<style>
:root {
  --bg: #0a0a0f;
  --fg: #e8e8f0;
  --dim: #8a8a98;
  --accent: #7fb3ff;
  --panel: #141420;
  --panel-hi: #1f1f2e;
  --border: #25253a;
  --danger: #ff8787;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 20px;
  padding-top: max(28px, env(safe-area-inset-top));
  padding-bottom: max(28px, env(safe-area-inset-bottom));
  gap: 22px;
}
h1 {
  font-size: 20px;
  font-weight: 400;
  margin: 0;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--fg);
}
.panel {
  width: 100%;
  max-width: 440px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  transition: opacity 0.25s;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: none; }
.row .label {
  font-size: 15px;
  color: var(--dim);
  letter-spacing: 0.03em;
}
.stepper {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stepper button {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--panel-hi);
  color: var(--fg);
  border: 1px solid var(--border);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  font-family: inherit;
}
.stepper button:hover { background: #2a2a3e; }
.stepper button:active { background: #34344a; }
.stepper .value {
  min-width: 92px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.rate {
  font-size: 13px;
  color: var(--dim);
  text-align: center;
  margin-top: -10px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
button.primary {
  width: 100%;
  max-width: 440px;
  padding: 22px;
  background: var(--accent);
  color: #0a0a0f;
  border: none;
  border-radius: 18px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.08s, background 0.2s;
}
button.primary:active { transform: scale(0.98); }
button.primary.stop { background: var(--danger); }
.status {
  width: 100%;
  max-width: 440px;
  text-align: center;
  font-size: 15px;
  color: var(--dim);
  min-height: 22px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}
.settings.disabled {
  opacity: 0.35;
  pointer-events: none;
}
.footer {
  margin-top: auto;
  font-size: 11px;
  color: #55556a;
  text-align: center;
  letter-spacing: 0.08em;
  padding-top: 20px;
}
</style>
</head>
<body>
  <h1>Resound</h1>

  <div class="panel settings" id="settings">
    <div class="row">
      <span class="label">Inhale</span>
      <div class="stepper">
        <button data-step="-0.1" data-target="inhale" aria-label="Decrease inhale">−</button>
        <span class="value" id="inhaleValue">5.5 s</span>
        <button data-step="0.1" data-target="inhale" aria-label="Increase inhale">+</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Exhale</span>
      <div class="stepper">
        <button data-step="-0.1" data-target="exhale" aria-label="Decrease exhale">−</button>
        <span class="value" id="exhaleValue">5.5 s</span>
        <button data-step="0.1" data-target="exhale" aria-label="Increase exhale">+</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Session</span>
      <div class="stepper">
        <button data-step="-1" data-target="session" aria-label="Decrease session">−</button>
        <span class="value" id="sessionValue">10 min</span>
        <button data-step="1" data-target="session" aria-label="Increase session">+</button>
      </div>
    </div>
  </div>

  <div class="rate" id="rateInfo">5.45 breaths / min · 11.0 s cycle</div>

  <button class="primary" id="startBtn">Begin</button>

  <div class="status" id="status"></div>

  <div class="footer">eyes closed · audio only</div>

<script>
/* ========== state ========== */
const state = {
  inhale: 5.5,   // seconds, 0.1 s precision
  exhale: 5.5,   // seconds, 0.1 s precision
  session: 10,   // minutes, 1 min precision
  running: false,
};

/* ========== dom helpers ========== */
const $ = (id) => document.getElementById(id);
const inhaleValueEl  = $('inhaleValue');
const exhaleValueEl  = $('exhaleValue');
const sessionValueEl = $('sessionValue');
const rateInfoEl     = $('rateInfo');
const startBtn       = $('startBtn');
const statusEl       = $('status');
const settingsEl     = $('settings');

const fmtSec  = s => s.toFixed(1) + ' s';
const fmtMin  = m => m + ' min';
const clamp   = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const round1  = v => Math.round(v * 10) / 10;
const fmtTime = s => {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60);
  return `${m}:${(s % 60).toString().padStart(2, '0')}`;
};

function updateUI() {
  inhaleValueEl.textContent  = fmtSec(state.inhale);
  exhaleValueEl.textContent  = fmtSec(state.exhale);
  sessionValueEl.textContent = fmtMin(state.session);
  const cycle = state.inhale + state.exhale;
  const bpm   = 60 / cycle;
  rateInfoEl.textContent = `${bpm.toFixed(2)} breaths / min · ${cycle.toFixed(1)} s cycle`;
}

document.querySelectorAll('.stepper button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state.running) return;
    const step   = parseFloat(btn.dataset.step);
    const target = btn.dataset.target;
    if (target === 'inhale')  state.inhale  = clamp(round1(state.inhale  + step), 0.5, 20);
    if (target === 'exhale')  state.exhale  = clamp(round1(state.exhale  + step), 0.5, 20);
    if (target === 'session') state.session = clamp(state.session + step, 1, 60);
    updateUI();
  });
});

updateUI();

/* ========== audio engine ==========
 *
 * sound design notes:
 *  - "fifth lead" = each phase plays its root note + a perfect fifth above
 *    (two detuned saws + a sine body, through a lowpass with gentle sweep).
 *  - exhale root is C3 (130.81 Hz). inhale root is a major third above (E3).
 *  - envelope is sin(π·t) over the full phase duration, so attack/decay
 *    automatically scale with whatever duration you set (informed by duration).
 *  - parallel-comb reverb send for air/space.
 *  - subtle LFO vibrato on the sine layer for organic motion.
 */

class BreathAudio {
  constructor() { this.ctx = null; }

  async init() {
    if (this.ctx && this.ctx.state !== 'closed') {
      if (this.ctx.state === 'suspended') await this.ctx.resume();
      return;
    }
    const AC  = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    this.ctx  = ctx;
    if (ctx.state === 'suspended') await ctx.resume();

    // master chain: master -> lowshelf (warm) -> highshelf (tame) -> out
    const master = ctx.createGain();
    master.gain.value = 0;
    this.master = master;

    const warm = ctx.createBiquadFilter();
    warm.type = 'lowshelf';
    warm.frequency.value = 220;
    warm.gain.value = 3;

    const air = ctx.createBiquadFilter();
    air.type = 'highshelf';
    air.frequency.value = 4500;
    air.gain.value = -5;

    master.connect(warm).connect(air).connect(ctx.destination);

    // parallel-comb reverb send (schroeder-style, with LP damping)
    const reverbIn  = ctx.createGain();
    reverbIn.gain.value = 1;
    this.reverbIn = reverbIn;

    const reverbOut = ctx.createGain();
    reverbOut.gain.value = 0.28;

    [0.0331, 0.0477, 0.0633, 0.0811, 0.1097, 0.1283].forEach(dTime => {
      const d    = ctx.createDelay(1);
      d.delayTime.value = dTime;
      const fb   = ctx.createGain();
      fb.gain.value = 0.55;
      const damp = ctx.createBiquadFilter();
      damp.type = 'lowpass';
      damp.frequency.value = 1800;
      reverbIn.connect(d);
      d.connect(damp).connect(fb).connect(d);
      d.connect(reverbOut);
    });
    reverbOut.connect(warm);

    // fade master up (avoids any subliminal thump when the first notes arrive)
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.45, ctx.currentTime + 0.05);
  }

  /**
   * Play one voice of the fifth lead at a given fundamental frequency.
   * Envelope is sin(π·t) over `duration` — a smooth organic swell whose
   * shape is dictated entirely by `duration` (short breath = snappy,
   * long breath = glacial).
   */
  playNote(freq, startTime, duration, peakGain, pan = 0) {
    const ctx = this.ctx;
    const safeDur = Math.max(0.25, duration);

    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const osc3 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc2.type = 'sawtooth';
    osc3.type = 'sine';
    osc1.frequency.value = freq;
    osc2.frequency.value = freq;
    osc3.frequency.value = freq;
    osc1.detune.value = -9;  // ±9 cents = mild chorus
    osc2.detune.value = +9;

    // subtle vibrato on the sine layer (kept tiny so it stays calm)
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 4.2;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 2.5;
    lfo.connect(lfoGain).connect(osc3.detune);

    const sawMix = ctx.createGain();
    sawMix.gain.value = 0.28;  // saws are loud; tame them
    const sineMix = ctx.createGain();
    sineMix.gain.value = 0.75;

    osc1.connect(sawMix);
    osc2.connect(sawMix);
    osc3.connect(sineMix);

    const filter = ctx.createBiquadFilter();
    filter.type  = 'lowpass';
    filter.Q.value = 0.6;
    sawMix.connect(filter);
    sineMix.connect(filter);

    const amp = ctx.createGain();
    amp.gain.value = 0;
    filter.connect(amp);

    const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (panner) {
      panner.pan.value = pan;
      amp.connect(panner);
      panner.connect(this.master);
      panner.connect(this.reverbIn);
    } else {
      amp.connect(this.master);
      amp.connect(this.reverbIn);
    }

    // amplitude envelope: sin(π·t) over the phase — peak at middle,
    // zero-crossings at both edges (click-free handoff between phases).
    const steps = Math.max(96, Math.floor(safeDur * 80));
    const curve = new Float32Array(steps);
    for (let i = 0; i < steps; i++) {
      const t = i / (steps - 1);
      curve[i] = peakGain * Math.sin(Math.PI * t);
    }
    amp.gain.setValueCurveAtTime(curve, startTime, safeDur);

    // filter cutoff rises with the envelope — opens the tone at the peak,
    // closes it again as the breath recedes.
    const fLo = 380, fHi = 1500;
    filter.frequency.setValueAtTime(fLo, startTime);
    filter.frequency.linearRampToValueAtTime(fHi, startTime + safeDur / 2);
    filter.frequency.linearRampToValueAtTime(fLo, startTime + safeDur);

    const stopTime = startTime + safeDur + 0.05;
    osc1.start(startTime); osc2.start(startTime); osc3.start(startTime); lfo.start(startTime);
    osc1.stop(stopTime);   osc2.stop(stopTime);   osc3.stop(stopTime);   lfo.stop(stopTime);

    // release node refs after the note finishes
    osc1.onended = () => {
      try {
        if (panner) panner.disconnect();
        amp.disconnect();
        filter.disconnect();
        sawMix.disconnect();
        sineMix.disconnect();
      } catch (e) { /* already disconnected */ }
    };
  }

  /** Play one breath phase as a fifth-lead chord (root + perfect fifth). */
  playBreath(phase, startTime, duration) {
    const exhaleRoot = 130.81;                // C3
    const majorThird = Math.pow(2,  4 / 12);  // 1.2599
    const fifth      = Math.pow(2,  7 / 12);  // 1.4983
    const rootFreq   = phase === 'inhale' ? exhaleRoot * majorThird : exhaleRoot;
    const fifthFreq  = rootFreq * fifth;

    // slight stereo spread between the two voices
    this.playNote(rootFreq,  startTime, duration, 0.22, -0.12);
    this.playNote(fifthFreq, startTime, duration, 0.15, +0.12);
  }

  /** Short sine beep for count-in / end chime. */
  playBeep(freq, time, duration = 0.2, gain = 0.16) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(gain, time + 0.02);
    g.gain.linearRampToValueAtTime(0,    time + duration);
    osc.connect(g).connect(this.master);
    osc.start(time);
    osc.stop(time + duration + 0.05);
    osc.onended = () => { try { g.disconnect(); } catch(e) {} };
  }

  fadeOutAndClose(fadeSec = 0.3, delayAfterMs = 500) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    try {
      this.master.gain.cancelScheduledValues(now);
      this.master.gain.setValueAtTime(this.master.gain.value, now);
      this.master.gain.linearRampToValueAtTime(0, now + fadeSec);
    } catch (e) {}
    const toClose = ctx;
    this.ctx = null;
    setTimeout(() => { toClose.close().catch(() => {}); }, delayAfterMs);
  }
}

const audio = new BreathAudio();

/* ========== session control ========== */
let scheduler      = null;
let wakeLock       = null;
let firstBreathAt  = 0;
let sessionEndsAt  = 0;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* ignore */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

async function startSession() {
  await audio.init();
  await requestWakeLock();

  state.running = true;
  startBtn.textContent = 'Stop';
  startBtn.classList.add('stop');
  settingsEl.classList.add('disabled');

  const ctx  = audio.ctx;
  const now  = ctx.currentTime;
  const lead = 3.0;

  // count-in: two ticks then a higher "go" tone
  audio.playBeep(659.25, now + 0.3, 0.14, 0.14);  // E5
  audio.playBeep(659.25, now + 1.3, 0.14, 0.14);  // E5
  audio.playBeep(987.77, now + 2.3, 0.18, 0.16);  // B5 (go)

  // schedule the entire session up front via the audio clock.
  // this is sample-accurate and survives tab throttling.
  firstBreathAt  = now + lead;
  const cycle    = state.inhale + state.exhale;
  const numCycles = Math.max(1, Math.floor((state.session * 60) / cycle));

  let t     = firstBreathAt;
  let phase = 'inhale';
  for (let i = 0; i < numCycles * 2; i++) {
    const dur = phase === 'inhale' ? state.inhale : state.exhale;
    audio.playBreath(phase, t, dur);
    t += dur;
    phase = phase === 'inhale' ? 'exhale' : 'inhale';
  }
  sessionEndsAt = t;

  scheduler = setInterval(updateRunningStatus, 250);
  updateRunningStatus();
}

function updateRunningStatus() {
  if (!state.running || !audio.ctx) return;
  const now = audio.ctx.currentTime;
  if (now < firstBreathAt) {
    const lead = Math.max(1, Math.ceil(firstBreathAt - now));
    statusEl.textContent = `starting in ${lead}…`;
    return;
  }
  if (now >= sessionEndsAt) {
    naturalEnd();
    return;
  }
  const elapsed   = now - firstBreathAt;
  const cycle     = state.inhale + state.exhale;
  const inCycle   = elapsed % cycle;
  const phase     = inCycle < state.inhale ? 'inhale' : 'exhale';
  const remaining = sessionEndsAt - now;
  statusEl.textContent = `${phase} · ${fmtTime(remaining)} remaining`;
}

function naturalEnd() {
  if (!state.running) return;
  state.running = false;
  clearInterval(scheduler);
  scheduler = null;
  releaseWakeLock();

  if (audio.ctx) {
    const now = audio.ctx.currentTime;
    // gentle ascending C major triad
    audio.playBeep(523.25, now + 0.4, 0.45, 0.12);  // C5
    audio.playBeep(659.25, now + 0.8, 0.45, 0.12);  // E5
    audio.playBeep(783.99, now + 1.2, 0.8,  0.15);  // G5
    // fade & close after the chime has had time to breathe + reverb
    setTimeout(() => audio.fadeOutAndClose(0.8, 1200), 2500);
  }

  statusEl.textContent = 'session complete';
  startBtn.textContent = 'Begin';
  startBtn.classList.remove('stop');
  settingsEl.classList.remove('disabled');
}

function userStop() {
  if (!state.running) return;
  state.running = false;
  clearInterval(scheduler);
  scheduler = null;
  releaseWakeLock();
  audio.fadeOutAndClose(0.3, 500);

  statusEl.textContent = 'stopped';
  startBtn.textContent = 'Begin';
  startBtn.classList.remove('stop');
  settingsEl.classList.remove('disabled');
}

startBtn.addEventListener('click', () => {
  if (state.running) userStop();
  else startSession();
});

// re-acquire wake lock if the user returns to the tab mid-session
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.running) {
    requestWakeLock();
  }
});

/* ========== PWA service worker ========== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
